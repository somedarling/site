<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data: https://raw.githubusercontent.com; connect-src https://api.github.com; form-action 'none'"><title>よもくれ画帖・投稿管理</title><style>
:root{font-family:system-ui,sans-serif;color:#5b544f;background:#efe6d9}*{box-sizing:border-box}body{margin:0;padding:18px;background:#efe6d9}main{max-width:720px;margin:auto}h1{font-family:serif;font-size:1.6rem}section{background:#fffaf0d9;padding:20px;margin:15px 0}input,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #b9aca1;background:#fffdf8;color:inherit;border-radius:3px}label{display:block;margin:13px 0 5px;font-weight:600}textarea{min-height:90px}button{margin:7px 0;background:#c5dfdc;cursor:pointer}.secondary{background:#e8e4dc}.danger{background:#f0d1c8}.hidden{display:none}.hint{font-size:.87rem;line-height:1.6;color:#736c66}.status{padding:12px;background:#e3efea;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#f6ddd6}.item{border-top:1px solid #ddd1c6;padding:12px 0}.item img{width:90px;height:90px;object-fit:contain;vertical-align:middle;margin-right:12px}.item button{width:auto;padding:7px 12px}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}.edit-note{background:#edf5f0;padding:11px 12px;line-height:1.6}.editing-preview{max-width:160px;max-height:160px;object-fit:contain;display:block;margin:10px 0}.item-actions{display:flex;gap:8px;flex-wrap:wrap}.item-actions button{margin:5px 0}.item-label{display:block;margin:6px 0;overflow-wrap:anywhere}
#preview{padding:12px;background:#fffdf8;overflow-wrap:anywhere}#preview img{display:block;max-width:100%;max-height:240px;margin:8px 0}#preview p{white-space:pre-wrap}select{font:inherit;max-width:100%}@media(max-width:480px){
 body{padding-inline:12px}
 section{padding:14px}
 button,input,textarea{font-size:16px;box-sizing:border-box}
 button,input{min-height:44px}
 input[type=checkbox]{min-height:auto}
 #save,#preview-button{width:100%}
 #save-status:empty{display:none}
 .item-actions{flex-wrap:wrap}
 .item-actions button{flex:1 1 6em}
}
</style></head><body><main><h1>よもくれ画帖 <small>投稿管理</small></h1><p class="hint">よもよも帳と同じGitHubトークンで、Neocities用アルバムの画像を追加します。NeocitiesのAPIキーは入力しません。</p><section><h2>1. GitHubに接続</h2><label for="token">Fine-grained token</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><label class="check"><input id="remember" type="checkbox">この端末でトークンを記憶する（共有端末では使用しない）</label><button id="connect">接続して読み込む</button><button id="forget" class="secondary">保存したトークンを消去</button><p id="status" class="status" role="status">未接続</p></section><section id="editor" class="hidden"><h2 id="editor-heading">2. 画像をぽいぽい追加</h2>
<p id="edit-note" class="edit-note hidden">編集中：画像はそのまま、タイトルと説明を変更できます。画像を入れ替える場合は、新規に投稿してください。</p>
<img id="edit-preview" class="editing-preview hidden" alt="編集中の画像"><label for="images">画像を選択（複数可・1枚8MBまで）</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><label for="title">タイトル（省略可）</label><input id="title"><label for="description">説明（省略可）</label><textarea id="description"></textarea><button type="button" id="preview-button" aria-controls="preview" aria-expanded="false">投稿前プレビュー</button>
<div id="preview" class="hidden" aria-label="投稿前プレビュー"></div>
<button type="button" id="save" disabled>GitHubに保存</button>
<p id="save-status" role="status" aria-live="polite"></p>
<button id="cancel-edit" class="secondary hidden" type="button">編集をやめて新規投稿に戻る</button><p class="hint">保存後、GitHub Actionsで公開処理が始まる場合があります。保存に失敗したときは、再接続すると、この端末に保存された新規画像投稿を再試行できます。</p></section><section id="listing" class="hidden"><h2>3. 登録済み画像</h2><div id="items"></div></section><p><a href="https://4ki.neocities.org/album/" target="_blank" rel="noopener noreferrer">公開アルバムを見る</a></p></main><script>
'use strict';
const OWNER='somedarling',REPO='site',BRANCH='main',DATA='public/album/items.json',DIR='public/album/images',KEY='yomoyomo_album_pat';
const $=id=>document.getElementById(id);
let token='',items=[],sha='',busy=false,editingId=null,review=null,pending=null;
let previewImages=[];
const imageTypes={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'};
function previewUrl(path){const parts=String(path||'').split('/');if(parts.length!==2||parts[0]!=='images'||!/^[-a-zA-Z0-9_.]+$/.test(parts[1])||parts[1].startsWith('.'))return '';return 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/public/album/images/'+encodeURIComponent(parts[1])}
function releasePreview(){
 for(const url of previewImages)URL.revokeObjectURL(url);
 previewImages=[];review=null;$('preview-button').setAttribute('aria-expanded','false');$('preview').replaceChildren();$('preview').classList.add('hidden');
}
function updateControls(){
 $('connect').disabled=busy;
 $('forget').disabled=busy;
 for(const id of ['title','description','preview-button','cancel-edit'])$(id).disabled=busy||!!pending;
 $('images').disabled=busy||!!pending||editingId!==null;
 $('save').disabled=busy||!token||(!pending&&!review);
 $('save').textContent=pending?'同じ内容で保存を再試行':'GitHubに保存';
}
function renderReview(){
 const files=[...$('images').files];
 if(editingId===null&&!files.length){status('画像を選んでください。',true);return}
 if(files.some(file=>file.size>8*1024*1024||!imageTypes[file.type])){
  status('PNG・JPEG・WebP・GIFの画像を1枚8MB以下で選んでください。',true);return;
 }
 releasePreview();
 review={files,title:$('title').value.trim(),description:$('description').value};
 $('preview-button').setAttribute('aria-expanded','true');
 const panel=$('preview'),heading=document.createElement('h3'),description=document.createElement('p');
 heading.textContent=review.title||'（タイトルなし）';
 description.textContent=review.description;
 panel.append(heading,description);
 if(editingId===null)previewImages=files.map(file=>URL.createObjectURL(file));
 const sources=editingId===null?previewImages:[previewUrl(items.find(item=>item.id===editingId)?.path)];
 for(const src of sources.filter(Boolean)){
  const image=document.createElement('img');image.src=src;image.alt='投稿予定の画像';panel.append(image);
 }
 panel.classList.remove('hidden');updateControls();
}
function status(message,error=false){
 for(const id of ['status','save-status']){
  $(id).textContent=message;$(id).classList.toggle('error',error);
 }
}
function base64Utf8(s){const b=new TextEncoder().encode(s);let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)}
function decodeUtf8(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
async function fileBase64(f){const b=new Uint8Array(await f.arrayBuffer());let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)}
async function api(path,method='GET',body,raw=false){
 const query=method==='GET'?'?ref='+encodeURIComponent(BRANCH):'';
 const response=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path+query,{
  method,headers:{Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json',
   Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',
   ...(body?{'Content-Type':'application/json'}:{})},
  body:body?JSON.stringify(body):undefined,cache:'no-store',signal:AbortSignal.timeout(30000)
 });
 if(!response.ok){
  const description={401:'トークンを確認してください。',403:'権限またはAPIの利用制限を確認してください。',
   404:'ファイルまたはリポジトリにアクセスできません。',409:'一覧が更新されました。再試行してください。',
   422:'ファイルの状態または入力内容を確認してください。'};
  const error=new Error('GitHub '+response.status+'：'+(description[response.status]||'保存先との通信に失敗しました。'));
  error.status=response.status;throw error;
 }
 return raw?response.blob():response.json();
}
async function readIndex(){
 const data=await api(DATA);
 const current=JSON.parse(decodeUtf8(data.content));
 if(!Array.isArray(current)||typeof data.sha!=='string'||!data.sha||
  current.some(item=>!item||typeof item.id!=='string'||typeof item.path!=='string')||
  new Set(current.map(item=>item.id)).size!==current.length)throw Error('items.json の形式を確認してください。');
 return {current,sha:data.sha};
}
function openRetryStore(){
 return new Promise((resolve,reject)=>{
  if(!globalThis.indexedDB){reject(new Error('このブラウザでは再試行用の保存領域を開けません。'));return}
  const request=indexedDB.open('neocities-album-retry-v1',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('uploads');
  request.onsuccess=()=>resolve(request.result);
  request.onerror=request.onblocked=()=>reject(new Error('再試行用の保存領域を開けません。'));
 });
}
async function retryRecord(operation,batch){
 const db=await openRetryStore();
 try{
  return await new Promise((resolve,reject)=>{
   const tx=db.transaction('uploads',operation==='get'?'readonly':'readwrite');
   const store=tx.objectStore('uploads'),key=OWNER+'/'+REPO+'/'+BRANCH;
   const request=operation==='add'?store.add(batch,key):store.get(key);
   if(operation==='delete')request.onsuccess=()=>{
    if(request.result?.[0]?.item.id===batch[0].item.id)store.delete(key);
   };
   tx.oncomplete=()=>resolve(request.result);
   tx.onabort=()=>reject(new Error(operation==='add'?
    '再試行用データを保存できませんでした。別の画面に保留中の投稿がないか、端末の空き容量と合わせて確認してください。':
    '端末の再試行用データにアクセスできませんでした。'));
  });
 }finally{db.close()}
}
function restorePending(batch){
 pending=batch;
 for(const entry of pending)entry.attempted=true;
 const first=pending[0].item;
 $('title').value=first.title;$('description').value=first.description;
 const panel=$('preview');
 panel.replaceChildren();
 for(const entry of pending){
  const url=URL.createObjectURL(entry.file);previewImages.push(url);
  const image=document.createElement('img');image.src=url;image.alt='再試行待ちの画像';panel.append(image);
 }
 panel.classList.remove('hidden');$('preview-button').setAttribute('aria-expanded','true');
}
async function saveImage(entry){
 const path=DIR+'/'+entry.name;
 const content=await fileBase64(entry.file);
 if(entry.attempted){
  let existing;
  try{existing=await api(path,'GET',undefined,true)}
  catch(error){if(error.status!==404)throw error}
  if(existing){
   if(await fileBase64(existing)!==content)throw Error('同名で内容の異なる画像が存在します。');
   return;
  }
 }
 entry.attempted=true;
 // A create request never includes an existing file SHA.
 await api(path,'PUT',{message:'Add album image '+entry.name,content,branch:BRANCH});
}
function setBusy(value){busy=value;updateControls()}
function resetEditor(){
  releasePreview();editingId=null;
  $('editor-heading').textContent='2. 画像をぽいぽい追加';
  $('edit-note').classList.add('hidden');
  $('edit-preview').classList.add('hidden');
  $('images').disabled=false;
  $('images').value='';
  $('title').value='';
  $('description').value='';
  updateControls();
  $('cancel-edit').classList.add('hidden');
}
function editItem(id){
  if(busy||pending)return;
  const p=items.find(x=>x.id===id);
  if(!p){status('対象の画像が見つかりません。',true);return}
  releasePreview();editingId=id;
  $('editor-heading').textContent='2. 画像の情報を編集';
  $('edit-note').classList.remove('hidden');
  $('edit-preview').src=previewUrl(p.path);
  $('edit-preview').classList.remove('hidden');
  $('images').value='';
  $('images').disabled=true;
  $('title').value=p.title||'';
  $('description').value=p.description||'';
  updateControls();
  $('cancel-edit').classList.remove('hidden');
  $('editor').scrollIntoView({behavior:'smooth',block:'start'});
  status('画像のタイトルと説明を編集できます。');
}
function render(){
  const el=$('items');el.replaceChildren();
  for(const p of [...items].reverse()){
    const div=document.createElement('div');div.className='item';
    const img=document.createElement('img');img.src=previewUrl(p.path);img.alt='登録画像';img.loading='lazy';
    const label=document.createElement('span');label.className='item-label';label.textContent=(p.title||'無題')+'　'+(p.created||'').slice(0,10);
    const actions=document.createElement('div');actions.className='item-actions';
    const editBtn=document.createElement('button');editBtn.type='button';editBtn.className='secondary';editBtn.textContent='編集';editBtn.onclick=()=>editItem(p.id);
    const delBtn=document.createElement('button');delBtn.type='button';delBtn.className='danger';delBtn.textContent='一覧から削除';delBtn.onclick=()=>removeItem(p.id);
    actions.append(editBtn,delBtn);div.append(img,label,actions);el.append(div);
  }
  if(!items.length)el.textContent='まだ画像はありません。';
}
try{const saved=localStorage.getItem(KEY);if(saved){$('token').value=saved;$('remember').checked=true}}catch{}
$('connect').onclick=async()=>{
 if(busy)return;
 const candidate=$('token').value.trim();
 if(!candidate){status('トークンを入力してください。',true);return}
 const previous=token;
 token=candidate;setBusy(true);
 try{
  const latest=await readIndex();
  let storageWarning='';
  if(!pending&&editingId===null){
   items=latest.current;sha=latest.sha;render();
   const batch=await retryRecord('get').catch(error=>{
    storageWarning=error.message+' 新規画像の保存には再試行用データの保存が必要です。';
    return null;
   });
   if(batch?.length){releasePreview();restorePending(batch)}
  }
  $('editor').classList.remove('hidden');$('listing').classList.remove('hidden');
  status(storageWarning||(pending?'接続しました。同じ内容で再試行できます。':'GitHubに接続しました。'),!!storageWarning);
  try{if($('remember').checked)localStorage.setItem(KEY,candidate);else localStorage.removeItem(KEY)}
  catch{status('接続しました。端末のトークン保存設定は更新できませんでした。',true)}
 }catch(error){token=previous;status(error.message,true)}
 finally{setBusy(false)}
};
$('forget').onclick=()=>{
 if(busy)return;
 try{localStorage.removeItem(KEY)}catch{status('端末に保存したトークンを消去できませんでした。',true);return}
 token='';$('token').value='';$('remember').checked=false;updateControls();
 status('接続を解除しました。入力内容はこの画面に残ります。');
};
$('cancel-edit').onclick=()=>{resetEditor();status('新規投稿に戻りました。')};
$('preview-button').onclick=renderReview;
for(const id of ['title','description','images']){
 $(id).addEventListener(id==='images'?'change':'input',()=>{releasePreview();updateControls()});
}
async function write(next,message){const r=await api(DATA,'PUT',{message,content:base64Utf8(JSON.stringify(next,null,2)+'\n'),sha,branch:BRANCH});sha=r.content.sha;items=next;render()}
$('save').onclick=async()=>{
 if(busy||!token||(!review&&!pending))return;
 setBusy(true);
 try{
  if(editingId!==null){
   const id=editingId,target=items.find(item=>item.id===id);
   if(!target)throw Error('編集中の画像が見つかりません。');
   const latest=await readIndex(),current=latest.current;
   const saved=current.find(item=>item.id===id);
   if(!saved)throw Error('画像が一覧から外れています。編集を取り消し、GitHubに再接続して一覧を確認してください。');
   if(saved.title===review.title&&saved.description===review.description){items=current;sha=latest.sha;render()}
   else{
    if(JSON.stringify(saved)!==JSON.stringify(target))throw Error('別の操作で画像の情報が変わりました。編集を取り消し、一覧を読み直してください。');
    sha=latest.sha;
    await write(current.map(item=>item.id===id?{...saved,title:review.title,description:review.description}:item),'Edit album item');
   }
  }else{
   if(!pending){
    const batch=review.files.map(file=>{
     const id='img-'+crypto.randomUUID(),name=id+'.'+imageTypes[file.type];
     return {file,name,uploaded:false,item:{id,path:'images/'+name,title:review.title,
      description:review.description,created:new Date().toISOString()}};
    });
    await retryRecord('add',batch);
    pending=batch;
   }
   for(const [index,entry] of pending.entries()){
    if(entry.uploaded)continue;
    status('画像を保存中 '+(index+1)+' / '+pending.length);
    await saveImage(entry);
    entry.uploaded=true;
   }
   const latest=await readIndex(),current=latest.current;
   sha=latest.sha;
   const additions=pending.map(entry=>entry.item).filter(item=>{
    const saved=current.find(row=>row.id===item.id);
    if(saved&&saved.path!==item.path)throw Error('同じIDの別の画像が一覧にあります。');
    return !saved;
   });
   if(additions.length)await write([...current,...additions],'Update album items');
   else{items=current;render()}
   await retryRecord('delete',pending);
   pending=null;
  }
  resetEditor();status('GitHubへの保存が完了しました。公開状況はGitHub Actionsで確認できます。');
 }catch(error){
  status((error.name==='TimeoutError'?'通信がタイムアウトしました。':error.name==='TypeError'?'接続を確認してください。':error.message)+(pending?' 入力と画像を保持しています。同じ内容で再試行できます。':' 編集内容を保持しています。'),true);
 }finally{setBusy(false)}
};
async function removeItem(id){if(busy||pending||!token)return;if(!confirm('アルバムの一覧から削除しますか？\n画像ファイル自体は残ります。'))return;setBusy(true);try{await write(items.filter(p=>p.id!==id),'Remove album item '+id);if(editingId===id)resetEditor();status('一覧から削除しました。GitHub上の一覧に反映しました。')}catch(e){status(e.message,true)}finally{setBusy(false)}};
</script></body></html>
