<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>画像置き場・投稿管理</title><style>
:root{font-family:system-ui,sans-serif;color:#5b544f;background:#efe6d9}*{box-sizing:border-box}body{margin:0;padding:18px;background:#efe6d9}main{max-width:720px;margin:auto}h1{font-family:serif;font-size:1.6rem}section{background:#fffaf0d9;padding:20px;margin:15px 0}input,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #b9aca1;background:#fffdf8;color:inherit;border-radius:3px}label{display:block;margin:13px 0 5px;font-weight:600}textarea{min-height:90px}button{margin:7px 0;background:#c5dfdc;cursor:pointer}.secondary{background:#e8e4dc}.danger{background:#f0d1c8}.hidden{display:none}.hint{font-size:.87rem;line-height:1.6;color:#736c66}.status{padding:12px;background:#e3efea;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#f6ddd6}.item{border-top:1px solid #ddd1c6;padding:12px 0}.item img{width:90px;height:90px;object-fit:contain;vertical-align:middle;margin-right:12px}.item button{width:auto;padding:7px 12px}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}
</style></head><body><main><h1>画像置き場 <small>投稿管理</small></h1><p class="hint">よもよも帳と同じGitHubトークンで、Neocities用アルバムの画像を追加します。NeocitiesのAPIキーは入力しません。</p><section><h2>1. GitHubに接続</h2><label for="token">Fine-grained token</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><label class="check"><input id="remember" type="checkbox">この端末でトークンを記憶する（共有端末では使用しない）</label><button id="connect">接続して読み込む</button><button id="forget" class="secondary">保存したトークンを消去</button><p id="status" class="status" role="status">未接続</p></section><section id="editor" class="hidden"><h2>2. 画像をぽいぽい追加</h2><label for="images">画像を選択（複数可・1枚8MBまで）</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><label for="title">タイトル（省略可）</label><input id="title"><label for="description">説明（省略可）</label><textarea id="description"></textarea><button id="save">画像を保存して公開</button><p class="hint">画像はGitHubへ保存され、GitHub ActionsがNeocitiesへ転送します。画像の公開には少し時間がかかります。</p></section><section id="listing" class="hidden"><h2>3. 登録済み画像</h2><div id="items"></div></section><p><a href="https://4ki.neocities.org/album/" target="_blank" rel="noopener noreferrer">公開アルバムを見る</a></p></main><script>
'use strict';
const OWNER='somedarling',REPO='site',BRANCH='main',DATA='public/album/items.json',DIR='public/album/images',KEY='yomoyomo_album_pat';
const $=id=>document.getElementById(id);let token='',items=[],sha='',busy=false;
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function base64Utf8(s){const b=new TextEncoder().encode(s);let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)}
function decodeUtf8(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
async function fileBase64(f){const b=new Uint8Array(await f.arrayBuffer());let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)}
async function api(path,method='GET',body){const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path+(method==='GET'?'?ref='+BRANCH:''),{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error('GitHub '+r.status+': '+(data.message||'通信エラー'));return data}
function setBusy(v){busy=v;for(const id of ['connect','save'])$(id).disabled=v}
function render(){const el=$('items');el.replaceChildren();for(const p of [...items].reverse()){const div=document.createElement('div');div.className='item';const img=document.createElement('img');img.src='https://4ki.neocities.org/album/'+p.path;img.alt='登録画像';img.loading='lazy';const label=document.createElement('span');label.textContent=(p.title||'無題')+'　'+(p.created||'').slice(0,10);const btn=document.createElement('button');btn.className='danger';btn.textContent='一覧から削除';btn.onclick=()=>removeItem(p.id);div.append(img,label,document.createElement('br'),btn);el.append(div)}if(!items.length)el.textContent='まだ画像はありません。'}
async function load(){const data=await api(DATA);const arr=JSON.parse(decodeUtf8(data.content));if(!Array.isArray(arr))throw Error('items.jsonが不正です');items=arr;sha=data.sha;render();$('editor').classList.remove('hidden');$('listing').classList.remove('hidden');status(items.length+'枚の画像を読み込みました。')}
try{const saved=localStorage.getItem(KEY);if(saved){$('token').value=saved;$('remember').checked=true}}catch{}
$('connect').onclick=async()=>{if(busy)return;const t=$('token').value.trim();if(!t){status('トークンを入力してください。',true);return}token=t;setBusy(true);try{await load();try{if($('remember').checked)localStorage.setItem(KEY,t);else localStorage.removeItem(KEY)}catch{status('接続しましたが、端末への保存はできませんでした。')}}catch(e){token='';status(e.message,true)}finally{setBusy(false)}};
$('forget').onclick=()=>{try{localStorage.removeItem(KEY)}catch{}token='';$('token').value='';$('remember').checked=false;$('editor').classList.add('hidden');$('listing').classList.add('hidden');status('保存したトークンを消去し、接続を解除しました。')};
async function write(next,message){const r=await api(DATA,'PUT',{message,content:base64Utf8(JSON.stringify(next,null,2)+'\n'),sha,branch:BRANCH});sha=r.content.sha;items=next;render()}
$('save').onclick=async()=>{if(busy||!token)return;const files=[...$('images').files];if(!files.length){status('画像を選んでください。',true);return}if(files.some(f=>f.size>8*1024*1024)){status('8MBを超える画像があります。',true);return}const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'};if(files.some(f=>!ext[f.type])){status('対応していない画像形式があります。',true);return}setBusy(true);const next=[...items];try{for(let i=0;i<files.length;i++){const f=files[i];const id='img-'+Date.now().toString(36)+'-'+crypto.randomUUID().slice(0,8);const name=id+'.'+ext[f.type];status('画像を保存中 '+(i+1)+' / '+files.length);await api(DIR+'/'+name,'PUT',{message:'Add album image '+name,content:await fileBase64(f),branch:BRANCH});next.push({id,path:'images/'+name,title:$('title').value.trim(),description:$('description').value,created:new Date().toISOString()})}await write(next,'Update album items');$('images').value='';$('title').value='';$('description').value='';status('保存完了！ GitHub ActionsがNeocitiesへ反映します。')}catch(e){status('保存に失敗しました：'+e.message+'\n途中まで画像が保存された可能性があります。',true)}finally{setBusy(false)}};
async function removeItem(id){if(busy||!token)return;if(!confirm('アルバムの一覧から削除しますか？\n画像ファイル自体は残ります。'))return;setBusy(true);try{await write(items.filter(p=>p.id!==id),'Remove album item '+id);status('一覧から削除しました。公開ページの反映をお待ちください。')}catch(e){status(e.message,true)}finally{setBusy(false)}};
</script></body></html>
