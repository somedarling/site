<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>site 管理室（試作版）</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#34433f;background:#f7faf8}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px 14px 60px}header{padding:20px 0}h1{font-size:1.55rem;margin:0 0 6px}h2{font-size:1.1rem}p{line-height:1.65}.note{color:#657771;font-size:.88rem}.panel{background:white;border:1px solid #dce9e4;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #243e3210}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #bfcfc8;border-radius:9px;background:#fff;color:inherit}textarea{min-height:130px;resize:vertical}button{font:inherit;border:1px solid #adc8bb;background:#e8f4ed;color:#2b5b48;border-radius:9px;padding:9px 13px;cursor:pointer}button.primary{background:#387c65;color:#fff;border-color:#387c65}button.danger{background:#fff1f1;color:#a73b46;border-color:#e6b6bb}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a1c8b8}button+button{margin-left:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button+button{margin:0}.entry{padding:14px 0;border-bottom:1px solid #e4ece8}.entry:last-child{border:0}.meta{color:#74827c;font-size:.8rem}.entry h3{font-size:1rem;margin:5px 0}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.tabs{display:flex;gap:8px;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.gallery .entry{border:1px solid #e4ece8;border-radius:12px;padding:12px}.gallery .body{max-height:100px;overflow:auto;font-size:.88rem}.empty{padding:20px;text-align:center;color:#73847c}.warning{background:#fff9e8;border:1px solid #ebd9a5;padding:12px;border-radius:10px;font-size:.88rem}#status{min-height:1.5em;color:#326c55}
</style>
</head>
<body><main>
<header><h1>🌿 site 管理室</h1><p class="note">日記とアルバムの共通投稿システム・試作版 v0.1</p></header>
<div class="warning"><strong>現在はローカル試作版です。</strong> 投稿はこのブラウザ内だけに保存され、Nekoweb・Neocitiesには公開されません。別端末や別ブラウザには同期されず、ブラウザデータを消すと投稿も消えます。公開GitHub Pages上では誰でもこの画面を開けるため、秘密の文章やAPIキーは入力しないでください。</div>
<section class="panel"><h2 id="formTitle">新しい投稿</h2><form id="postForm"><label for="destination">投稿先（将来の公開先）</label><select id="destination"><option value="nekoweb">Nekoweb（日記）</option><option value="neocities">Neocities（アルバム）</option></select><label for="title">タイトル（省略可）</label><input id="title" maxlength="160" placeholder="今日のメモ"><label for="content">本文</label><textarea id="content" placeholder="つらつら書いてみる……"></textarea><div class="actions"><button class="primary" type="submit" id="submitButton">投稿を保存</button><button type="button" id="cancelEdit" hidden>編集をやめる</button></div></form><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>投稿一覧</h2><div class="tabs"><label for="filter" style="margin:0;align-self:center">表示先</label><select id="filter" style="width:auto;flex:1;min-width:140px"><option value="all">すべて</option><option value="nekoweb">Nekoweb</option><option value="neocities">Neocities</option></select><label for="layout" style="margin:0;align-self:center">表示</label><select id="layout" style="width:auto;flex:1;min-width:130px"><option value="diary">日記風</option><option value="album">アルバム風</option></select></div><div id="entries"></div></section>
</main><script>
'use strict';
const KEY='site-manager-draft-v1';
const $=id=>document.getElementById(id);
let posts=[];let editingId=null;
try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))posts=stored.filter(p=>p&&typeof p.id==='string'&&typeof p.content==='string');}catch(e){$('status').textContent='保存データを読み込めませんでした。';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(posts));return true;}catch(e){$('status').textContent='保存に失敗しました。ブラウザの保存容量や設定をご確認ください。';return false;}}
function clearForm(){$('postForm').reset();editingId=null;$('formTitle').textContent='新しい投稿';$('submitButton').textContent='投稿を保存';$('cancelEdit').hidden=true;}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function render(){const root=$('entries');root.replaceChildren();const selected=$('filter').value;const list=posts.filter(p=>selected==='all'||p.destination===selected).sort((a,b)=>b.created.localeCompare(a.created));root.className=$('layout').value==='album'?'gallery':'';if(!list.length){root.append(el('p','empty','まだ投稿がありません。'));return;}
for(const p of list){const article=el('article','entry');article.append(el('div','meta',new Date(p.created).toLocaleString('ja-JP')+' ・ '+(p.destination==='neocities'?'Neocities':'Nekoweb')));if(p.title)article.append(el('h3','',p.title));if(p.content)article.append(el('div','body',p.content));const actions=el('div','actions');const edit=el('button','','編集');edit.type='button';edit.addEventListener('click',()=>{editingId=p.id;$('destination').value=p.destination;$('title').value=p.title;$('content').value=p.content;$('formTitle').textContent='投稿を編集';$('submitButton').textContent='変更を保存';$('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'});});const del=el('button','danger','削除');del.type='button';del.addEventListener('click',()=>{if(!confirm('この投稿を削除しますか？'))return;const old=posts;posts=posts.filter(x=>x.id!==p.id);if(!save()){posts=old;return;}if(editingId===p.id)clearForm();$('status').textContent='投稿を削除しました。';render();});actions.append(edit,del);article.append(actions);root.append(article);}}
$('postForm').addEventListener('submit',event=>{event.preventDefault();const title=$('title').value.trim(),content=$('content').value.trim(),destination=$('destination').value;if(!title&&!content){$('status').textContent='タイトルか本文を入力してください。';return;}const previous=posts.map(p=>({...p}));if(editingId){const p=posts.find(x=>x.id===editingId);if(!p)return;p.title=title;p.content=content;p.destination=destination;p.updated=new Date().toISOString();}else{posts.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),title,content,destination,created:new Date().toISOString()});}if(!save()){posts=previous;return;}clearForm();$('status').textContent='ブラウザ内に保存しました（まだ公開されていません）。';render();});
$('cancelEdit').addEventListener('click',clearForm);$('filter').addEventListener('change',render);$('layout').addEventListener('change',render);render();
</script></body></html>
