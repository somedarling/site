<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つれづれメモ帳</title><style>
:root{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;color:#615955;background:#efe6d9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:#efe6d9;background-image:radial-gradient(circle at 17% 13%,#b4a99a44 0 1px,transparent 1.5px),radial-gradient(circle at 79% 61%,#97b5b744 0 1px,transparent 1.6px);background-size:131px 149px,197px 223px}a{color:inherit;text-underline-offset:.16em}.site-head{text-align:center;padding:34px 20px 22px}.site-head h1 a{text-decoration:none;color:inherit}.site-head h1 a:hover,.site-head h1 a:focus-visible{color:#397f82}.site-head h1{font-size:clamp(1.65rem,5vw,2.2rem);letter-spacing:.11em;margin:0 0 13px}.sub{font-size:.88rem;color:#77706c}.wrap{max-width:1020px;margin:auto;padding:15px 22px 75px;display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:23px;align-items:start}.toolbar,.article,.side,.blank{background:#fffaf0b8;padding:25px 28px;margin-bottom:22px}.toolbar{display:flex;gap:9px;align-items:center;background:#9bc4c3c9;padding:15px 17px}input,button{font:inherit;border:1px solid #b8aaa0;border-radius:2px;padding:10px;background:#fffaf0ed;color:#615955}input{min-width:0;flex:1}button{cursor:pointer;background:#d6e7e4}.article{overflow-wrap:anywhere;line-height:2.05}.date{font-size:.85rem;color:#827771}.article h2{font-size:1.24rem;margin:10px 0 18px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.article-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}.article-images img{width:100%;max-height:500px;object-fit:contain}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.pill{background:linear-gradient(transparent 45%,#a2cbcaad 45%);padding:3px 7px;font-size:.78rem}.side h3{background:linear-gradient(transparent 55%,#a2cbca 55%)}.side button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;border:0}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0}.pager button:disabled{opacity:.4}.muted{color:#80746e}[hidden]{display:none!important}@media(max-width:730px){.wrap{display:flex;flex-direction:column;padding:12px 22px 65px}.main-col,.side{width:100%}.site-head{padding:23px 18px}.article{padding:23px 20px}}
</style></head><body><header class="site-head"><h1><a href="/note/index.html" aria-label="つれづれメモ帳のトップへ戻る">つれづれメモ帳</a></h1><p class="sub">日々のこと、制作のこと、思いついたこと。</p></header><div class="wrap"><main class="main-col"><div class="toolbar" id="toolbar"><input id="search" type="search" placeholder="タイトル・本文・タグを検索" aria-label="投稿を検索"><span id="filterState"></span></div><div id="content"></div><nav id="pager" class="pager"><button id="prev">← 前へ</button><span id="pageNumber"></span><button id="next">次へ →</button></nav></main><aside id="sidebar" class="side" aria-label="アーカイブ"></aside></div><script type="application/json" id="post-data">[]</script><script>
'use strict';const POSTS=JSON.parse(document.getElementById('post-data').textContent);const PAGE_SIZE=5,$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});let page=1,category='',month='',search='';const monthKey=s=>String(s).slice(0,7);const linkTo=id=>'#post='+encodeURIComponent(id);function article(p){return '<article class="article"><div class="date">'+esc(date(p.created))+'</div><h2><a href="'+linkTo(p.id)+'">'+esc(p.title||'無題の投稿')+'</a></h2>'+(p.content?'<div class="body">'+esc(p.content)+'</div>':'')+(p.images?.length?'<div class="article-images">'+p.images.map(src=>'<img src="'+esc(src)+'" alt="投稿画像" loading="lazy">').join('')+'</div>':'')+'<div class="pills"><span class="pill">'+esc(p.category||'未分類')+'</span>'+(p.tags||[]).map(t=>'<span class="pill">#'+esc(t)+'</span>').join('')+'</div></article>'}function setFilter(type,value){if(type==='category')category=value;if(type==='month')month=value;page=1;location.hash='';render()}function renderSidebar(){const categories=[...new Set(POSTS.map(p=>p.category||'未分類'))].sort(),months=[...new Set(POSTS.map(p=>monthKey(p.created)))].sort().reverse();const group=(title,items,type)=>'<div><h3>'+title+'</h3>'+items.map(x=>'<button type="button" data-type="'+type+'" data-value="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>';$('sidebar').innerHTML=group('カテゴリー',['すべて',...categories],'category')+group('月別アーカイブ',['すべて',...months],'month');$('sidebar').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.type,b.dataset.value==='すべて'?'':b.dataset.value)))}function render(){let id=null;try{const match=location.hash.match(/^#post=(.*)$/);id=match?decodeURIComponent(match[1]):null}catch{}const detail=id?POSTS.find(p=>p.id===id):null;$('toolbar').hidden=!!detail;$('pager').hidden=!!detail;if(detail){$('content').innerHTML='<a href="#">← 一覧へ戻る</a>'+article(detail);document.title=(detail.title||'無題の投稿')+' | つれづれメモ帳';return}document.title='つれづれメモ帳';const filtered=POSTS.filter(p=>(!category||(p.category||'未分類')===category)&&(!month||monthKey(p.created)===month)&&(!search||((p.title||'')+' '+(p.content||'')+' '+(p.tags||[]).join(' ')).toLocaleLowerCase().includes(search)));const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,total);$('content').innerHTML=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE).map(article).join('')||'<div class="blank muted">該当する投稿はありません。</div>';$('pageNumber').textContent=page+' / '+total;$('prev').disabled=page<=1;$('next').disabled=page>=total;$('filterState').textContent=[category,month].filter(Boolean).join(' / ')}$('search').addEventListener('input',e=>{search=e.target.value.trim().toLocaleLowerCase();page=1;render()});$('prev').addEventListener('click',()=>{page--;render();window.scrollTo(0,0)});$('next').addEventListener('click',()=>{page++;render();window.scrollTo(0,0)});window.addEventListener('hashchange',render);renderSidebar();render();
</script></body></html>
